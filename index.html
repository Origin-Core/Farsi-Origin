<script type="module">


import { supabase } 
from "./supabase-config.js";



let currentUser = null;



const OWNER = "Origin-Core";

const REPO = "Farsi-Origin-";


const API = 
`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;



const grid =
document.getElementById("games-grid");



const modal =
document.getElementById("login-modal");





function escapeHTML(text){

return text
.replace(/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

}







function formatSize(bytes){


let size = bytes / 1024 / 1024;


return size.toFixed(1)+" MB";


}








async function loadGames(){


grid.innerHTML = `

<div class="game-card skeleton">

<div class="card-media"></div>

<div class="card-body">

<div class="skeleton-line"></div>

<div class="skeleton-line"></div>

</div>

</div>

`;



try{


const res =
await fetch(API);



const files =
await res.json();



const groups = {};



files.forEach(file=>{


let name =
file.name;


let base =
name.split(".")[0];


if(!groups[base])
groups[base]={};



if(
name.match(/\.(png|jpg|jpeg|webp)$/i)
)

groups[base].image=file;



if(
name.match(/\.(zip|rar|7z)$/i)
)

groups[base].download=file;



if(
name.match(/\.(txt|md)$/i)
)

groups[base].desc=file;



});





const games =
Object.values(groups)
.filter(
g=>g.image && g.download
);




if(!games.length){

grid.innerHTML=

"<p>هنوز فارسی سازی منتشر نشده</p>";

return;

}




grid.innerHTML="";



games.forEach((game,index)=>{


const card =
document.createElement("article");



card.className="game-card show";



card.innerHTML=`

<div class="card-media">

<img src="${game.image.download_url}">

</div>


<div class="card-body">


<h3 class="card-title">

${escapeHTML(
game.image.name.split(".")[0]
)}

</h3>


<p class="card-desc">

توضیح ثبت نشده

</p>


<div class="card-meta">

${formatSize(game.download.size)}

</div>


<a 
class="btn-download"
href="${game.download.download_url}">


⬇ دانلود فایل


</a>


</div>

`;





grid.appendChild(card);



loadDescription(game,card);



});



bindDownloads();



}catch(e){


grid.innerHTML=

"<p>خطا در دریافت اطلاعات گیت‌هاب</p>";


}



}








async function loadDescription(game,card){


if(!game.desc)
return;



try{


const r =
await fetch(game.desc.download_url);


const txt =
await r.text();



const p =
card.querySelector(".card-desc");



p.textContent =
txt.substring(0,140);



}catch{}

}








function bindDownloads(){



document
.querySelectorAll(".btn-download")
.forEach(btn=>{


btn.onclick=(e)=>{


if(!currentUser){


e.preventDefault();


modal.classList.add("active");


}


};



});



}









async function initAuth(){


const {

data:{
session

}

}

=
await supabase.auth.getSession();



currentUser =
session?.user || null;



updateAuthUI();




supabase.auth.onAuthStateChange(
(event,session)=>{


currentUser =
session?.user || null;


updateAuthUI();



});


}









function updateAuthUI(){


const box =
document.getElementById("auth-ui");



if(currentUser){


box.innerHTML=`

<span class="user-email">

${currentUser.email}

</span>


<button 
class="btn-outline"
id="logout">

خروج

</button>

`;



document
.getElementById("logout")
.onclick=
async()=>{


await supabase.auth.signOut();


};



}else{


box.innerHTML=`

<a href="login.html"
class="btn-outline">

ورود

</a>


<a href="register.html"
class="btn-primary">

ثبت نام

</a>

`;

}


}








document
.getElementById("close-modal")
.onclick=()=>{


modal.classList.remove("active");


};







initAuth();

loadGames();




</script>
