<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<title>بازیابی رمز</title>

</head>


<body>


<h1>
بازیابی رمز عبور
</h1>


<input id="email"
placeholder="ایمیل">


<button id="send">
ارسال لینک
</button>


<p id="msg"></p>



<script type="module">


import {forgot}
from "./auth.js";



send.onclick=async()=>{


try{


await forgot(email.value);


msg.innerText=
"لینک بازیابی ارسال شد";


}

catch(e){

msg.innerText=e.message;

}


}



</script>



</body>

</html>
