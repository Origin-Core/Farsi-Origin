<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
ثبت نام | Farsi-Origin
</title>


<style>

body{

background:#0A1118;
color:white;
font-family:tahoma;
display:flex;
align-items:center;
justify-content:center;
height:100vh;

}


.box{

background:#111C26;
padding:35px;
border-radius:20px;
width:350px;

}


input{

width:100%;
padding:12px;
margin:10px 0;

}


button{

width:100%;
padding:12px;
background:#10B981;
border:0;
border-radius:20px;

}

</style>

</head>


<body>


<div class="box">


<h2>
ساخت حساب
</h2>


<input id="email" placeholder="ایمیل">


<input id="password"
type="password"
placeholder="رمز عبور">


<button id="register">

ثبت نام

</button>


</div>



<script type="module">


import {register}
from "./auth.js";



document
.getElementById("register")
.onclick=()=>{


register(

email.value,

password.value

);


};



</script>


</body>
</html>
