<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>ثبت نام</title>

</head>


<body>


<div class="auth-box">


<h1>ثبت نام</h1>


<input id="email" placeholder="ایمیل">

<input id="password"
type="password"
placeholder="رمز عبور">


<button id="register">
ثبت نام
</button>


<p id="msg"></p>


</div>



<script type="module">

import {register}
from "./auth.js";



register.onclick=async()=>{


try{


await register(

email.value,

password.value

);


msg.innerText=
"ایمیل تایید ارسال شد";


}


catch(e){

msg.innerText=e.message;

}



}



</script>


</body>
</html>
