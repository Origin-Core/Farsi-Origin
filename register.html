<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ثبت‌نام | Farsi-Origin</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* همان استایل‌های فایل login */
  :root {
    --bg-deep:#0A1118; --bg-panel:#111C26; --jade-dark:#0B4F36; 
    --jade-bright:#10B981; --jade-soft:#A7F3D0; --text-primary:#F1F5F9; 
    --text-muted:#94A3B8; --font-display:'Lalezar', sans-serif; 
    --font-body:'Noto Sans Arabic', sans-serif; --font-brand:'Space Grotesk', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-deep); color: var(--text-primary);
    font-family: var(--font-body); height: 100vh; display: flex; 
    align-items: center; justify-content: center; overflow: hidden;
  }
  
  .ambient { position: fixed; inset: 0; z-index: -1; }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5;
    animation: float 12s infinite ease-in-out alternate;
  }
  .orb-1 { width: 350px; height: 350px; background: var(--jade-dark); top: 10%; left: 15%; }
  .orb-2 { width: 450px; height: 450px; background: rgba(16, 185, 129, 0.15); bottom: 5%; right: 10%; animation-delay: -6s; }
  @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, -50px) scale(1.1); } }

  .auth-box {
    background: rgba(17, 28, 38, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(52, 211, 153, 0.2); border-radius: 24px; padding: 3rem 2.5rem;
    width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(16, 185, 129, 0.1);
    transform: translateY(20px); opacity: 0; animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }

  .logo-text { font-family: var(--font-brand); font-weight: 700; font-size: 1.8rem; text-align: center; display: block; margin-bottom: 0.5rem; }
  .logo-text span { color: var(--jade-bright); }
  .title { font-family: var(--font-display); text-align: center; font-size: 2rem; margin: 0 0 2rem; font-weight: normal; }

  .form-group { margin-bottom: 1.5rem; position: relative; }
  .form-label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
  .form-input {
    width: 100%; background: rgba(10, 17, 24, 0.5); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; padding: 0.85rem 1rem; border-radius: 12px; font-family: inherit; font-size: 1rem;
    transition: all 0.3s ease; outline: none;
  }
  .form-input:focus { border-color: var(--jade-bright); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); background: rgba(10, 17, 24, 0.8); }
  
  .btn-submit {
    width: 100%; background: var(--jade-bright); color: var(--bg-deep); font-weight: 700; font-size: 1.1rem;
    padding: 0.9rem; border: none; border-radius: 12px; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 24px -8px rgba(16, 185, 129, 0.5); transition: all 0.2s ease; margin-top: 1rem;
  }
  .btn-submit:hover { background: #14b8a6; transform: translateY(-2px); box-shadow: 0 12px 28px -8px rgba(20, 184, 166, 0.6); }
  .btn-submit:active { transform: translateY(0); }
  
  .switch-page { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
  .switch-page a { color: var(--jade-bright); text-decoration: none; font-weight: 600; }
  .switch-page a:hover { text-decoration: underline; }

  .msg-box { padding: 0.8rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
  .msg-error { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
  .msg-success { background: rgba(16, 185, 129, 0.1); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
</style>
</head>
<body>

<div class="ambient"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<div class="auth-box">
  <a href="index.html" style="text-decoration:none; color:inherit;">
    <span class="logo-text">Farsi<span>-Origin</span></span>
  </a>
  <h1 class="title">ساخت حساب کاربری</h1>
  
  <div id="msg-box" class="msg-box"></div>

  <form id="register-form">
    <div class="form-group">
      <label class="form-label">ایمیل</label>
      <input type="email" id="email" class="form-input" required placeholder="ایمیل خود را وارد کنید" dir="ltr">
    </div>
    <div class="form-group">
      <label class="form-label">رمز عبور (حداقل ۶ کاراکتر)</label>
      <input type="password" id="password" class="form-input" required minlength="6" placeholder="••••••••" dir="ltr">
    </div>
    <button type="submit" class="btn-submit" id="submit-btn">ثبت نام سریع</button>
  </form>
  
  <div class="switch-page">
    از قبل حساب دارید؟ <a href="login.html">وارد شوید</a>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-config.js';
  
  const form = document.getElementById('register-form');
  const msgBox = document.getElementById('msg-box');
  const submitBtn = document.getElementById('submit-btn');

  // بررسی وضعیت لاگین از قبل
  supabase.auth.getSession().then(({ data: { session } }) => {
    if(session) window.location.href = 'index.html';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.textContent = 'در حال ثبت...';
    submitBtn.style.opacity = '0.7';
    msgBox.style.display = 'none';
    msgBox.className = 'msg-box'; // reset classes

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signUp({ email, password });

    if (error) {
      msgBox.textContent = 'خطا در ثبت نام. ممکن است این ایمیل قبلاً ثبت شده باشد.';
      msgBox.classList.add('msg-error');
      msgBox.style.display = 'block';
      submitBtn.textContent = 'ثبت نام سریع';
      submitBtn.style.opacity = '1';
    } else {
      msgBox.textContent = 'ثبت نام موفق! در حال انتقال به سایت...';
      msgBox.classList.add('msg-success');
      msgBox.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    }
  });
</script>
</body>
</html>
