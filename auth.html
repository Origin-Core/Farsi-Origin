<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Farsi-Origin | حساب کاربری</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Sans+Arabic:wght@400;700&display=swap');


*{
box-sizing:border-box;
}


body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle at top,#065f46,#020617 60%);

font-family:"Noto Sans Arabic";

display:flex;
justify-content:center;
align-items:center;

color:white;

}



.card{

width:420px;
max-width:90%;

padding:35px;

border-radius:30px;

background:
rgba(15,23,42,.8);

border:1px solid rgba(16,185,129,.3);

backdrop-filter:blur(20px);

box-shadow:
0 0 50px rgba(16,185,129,.25);


animation:show .5s ease;


}



@keyframes show{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:none;
}

}



.logo{

font-family:Lalezar;
font-size:42px;
text-align:center;

}



.logo span{

color:#10b981;

}



h2{

text-align:center;

}



input{


width:100%;

padding:15px;

margin:8px 0;

border-radius:15px;

background:#020617;

border:1px solid #334155;

color:white;

font-size:15px;


}



button{

width:100%;

padding:15px;

border:0;

border-radius:15px;

background:#10b981;

font-weight:bold;

font-size:16px;

cursor:pointer;

margin-top:15px;


}



button:hover{

filter:brightness(1.1);

}



.link{

text-align:center;

margin-top:18px;

color:#6ee7b7;

cursor:pointer;

}



.message{

text-align:center;

margin-top:20px;

color:#facc15;

font-size:14px;

}



</style>

</head>


<body>


<div class="card">


<div class="logo">
Farsi<span>-Origin</span>
</div>


<h2 id="title">
ورود
</h2>



<input id="email" placeholder="ایمیل">


<input id="password"
type="password"
placeholder="رمز عبور">



<button id="submit">
ورود
</button>



<div class="link" id="change">

ساخت حساب جدید

</div>



<div class="link"
onclick="location.href='forgot.html'">

فراموشی رمز عبور

</div>


<div class="message" id="message"></div>



</div>


<script type="module" src="auth.js"></script>


</body>

</html>
