<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="page-title">فارسی‌سازی | Farsi-Origin</title>
<meta name="theme-color" content="#0A141F" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='11' width='26' height='13' rx='6.5' fill='%2318B87C'/%3E%3Crect x='6' y='7' width='6' height='6' rx='2' fill='%2318B87C'/%3E%3Crect x='20' y='7' width='6' height='6' rx='2' fill='%2318B87C'/%3E%3Crect x='9.2' y='14' width='2.6' height='7' rx='0.8' fill='%230E7A54'/%3E%3Crect x='6.7' y='16.2' width='7.6' height='2.6' rx='0.8' fill='%230E7A54'/%3E%3Ccircle cx='22' cy='15.5' r='1.8' fill='%230E7A54'/%3E%3Ccircle cx='25.5' cy='19' r='1.8' fill='%230E7A54'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-ambient" aria-hidden="true"></div>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html" aria-label="Farsi-Origin">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="mark-body" x="3" y="11" width="26" height="13" rx="6.5"/>
        <rect class="mark-body" x="6" y="7" width="6" height="6" rx="2"/>
        <rect class="mark-body" x="20" y="7" width="6" height="6" rx="2"/>
        <rect class="mark-detail" x="9.2" y="14" width="2.6" height="7" rx="0.8"/>
        <rect class="mark-detail" x="6.7" y="16.2" width="7.6" height="2.6" rx="0.8"/>
        <circle class="mark-detail" cx="22" cy="15.5" r="1.8"/>
        <circle class="mark-detail" cx="25.5" cy="19" r="1.8"/>
      </svg>
      <span class="logo-text">Farsi<span class="logo-accent">-Origin</span></span>
    </a>
    <nav class="nav">
      <a href="index.html#games">بازی‌ها</a>
      <a href="index.html#how">فرایند</a>
      <a href="https://github.com/Origin-Core/Farsi-Origin" target="_blank" rel="noopener">گیت‌هاب</a>
    </nav>
  </div>
</header>

<main>
  <div class="container product-page">
    <a class="back-link" href="index.html#games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>بازگشت به کتابخانه</span>
    </a>
    <div id="product-area"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <span class="logo-text">Farsi<span class="logo-accent">-Origin</span></span>
      <p>یک پروژه‌ی متن‌باز برای فارسی‌سازی بازی‌های ویدیویی.</p>
    </div>
    <a href="https://github.com/Origin-Core/Farsi-Origin" target="_blank" rel="noopener">مخزن گیت‌هاب ↗</a>
  </div>
</footer>

<script src="app.js"></script>
<script>
(function(){
  "use strict";

  const area = document.getElementById("product-area");
  const params = new URLSearchParams(location.search);
  const key = (params.get("g") || "").trim().toLowerCase();

  function renderSkeleton(){
    area.innerHTML = `
      <div class="product-hero product-skeleton" aria-hidden="true">
        <div class="skeleton-block" style="aspect-ratio:3/4;border-radius:20px;"></div>
        <div>
          <div class="skeleton-line w-70" style="height:2rem;margin-bottom:1rem;"></div>
          <div class="skeleton-line w-40"></div>
          <div class="skeleton-line w-100" style="max-width:220px;height:2.6rem;margin-top:1rem;"></div>
        </div>
      </div>`;
  }

  function renderNotFound(){
    area.innerHTML = `
      <div class="state-message">
        <p class="state-title">این فارسی‌سازی پیدا نشد</p>
        <p class="state-sub">ممکنه لینک اشتباه باشه یا فایل‌هاش جابه‌جا شده باشن.</p>
        <a class="btn-retry" href="index.html#games">بازگشت به کتابخانه</a>
      </div>`;
  }

  function renderError(){
    area.innerHTML = `
      <div class="state-message">
        <p class="state-title">دریافت اطلاعات ممکن نشد</p>
        <p class="state-sub">اتصال به گیت‌هاب با مشکل مواجه شد. چند لحظه دیگه دوباره امتحان کن.</p>
        <button class="btn-retry" id="retry-btn" type="button">تلاش دوباره</button>
      </div>`;
    const btn = document.getElementById("retry-btn");
    if(btn) btn.addEventListener("click", load);
  }

  async function fillContent(p){
    const contentEl = document.getElementById("product-content");
    if(!contentEl) return;

    if(p.richHtml){
      try{
        const res = await fetch(p.richHtml.download_url);
        if(res.ok){ contentEl.innerHTML = await res.text(); return; }
      }catch(e){ /* fall through to plain description */ }
    }
    if(p.desc){
      try{
        const res = await fetch(p.desc.download_url);
        if(res.ok){
          const raw = (await res.text()).trim();
          if(raw){ contentEl.innerHTML = FO.formatDescription(raw); return; }
        }
      }catch(e){ /* fall through to empty state */ }
    }
    contentEl.innerHTML = `<p>توضیحات بیشتری برای این فارسی‌سازی ثبت نشده.</p>`;
  }

  function renderProduct(p){
    document.title = `${p.displayName} | Farsi-Origin`;
    const titleTag = document.getElementById("page-title");
    if(titleTag) titleTag.textContent = `${p.displayName} | Farsi-Origin`;

    const sizeStr = FO.formatSize(p.archive.size);
    area.innerHTML = `
      <div class="product-hero">
        <div class="product-media">
          <img src="${p.image.download_url}" alt="جلد فارسی‌سازی ${FO.escapeHtml(p.displayName)}" />
          <span class="ribbon">فارسی‌سازی</span>
        </div>
        <div class="product-info">
          <h1 class="product-title">${FO.escapeHtml(p.displayName)}</h1>
          <div class="card-meta"><span>${sizeStr}</span></div>
          <a class="btn-download btn-download-lg" href="${p.archive.download_url}" download="${FO.escapeHtml(p.archive.name)}">
            <svg class="icon-download" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>دانلود فایل</span>
          </a>
        </div>
      </div>
      <div class="product-content" id="product-content"><p>در حال بارگذاری توضیحات…</p></div>`;

    fillContent(p);
  }

  async function load(){
    if(!key){ renderNotFound(); return; }
    renderSkeleton();
    try{
      const groups = await FO.fetchGroups();
      const p = groups[key];
      if(!p || !p.image || !p.archive){ renderNotFound(); return; }
      renderProduct(p);
    }catch(err){
      renderError();
    }
  }

  document.addEventListener("DOMContentLoaded", load);
})();
</script>
</body>
</html>
