<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>رمز جدید</title>

</head>



<body>


<h1>
رمز جدید
</h1>


<input id="password"
type="password"
placeholder="رمز جدید">


<button id="change">
تغییر رمز
</button>


<p id="msg"></p>




<script type="module">


import {
resetPassword
}
from "./auth.js";



change.onclick=async()=>{


try{


await resetPassword(
password.value
);


msg.innerText=
"رمز تغییر کرد";


setTimeout(()=>{

location.href="login.html";

},2000);



}

catch(e){

msg.innerText=e.message;

}



}



</script>


</body>

</html>
